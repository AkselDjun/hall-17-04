name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - uses: actions/cache@v6
        with:
          path: public/images
          key: images-${{ hashFiles('assets/photos/**', 'scripts/build-images.mjs') }}

      - name: Resolve site address
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "NEXT_PUBLIC_BASE_PATH=/${repo}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BOOKING_DEMO: true
          NEXT_PUBLIC_INDEXABLE: ${{ vars.INDEXABLE }}

      - name: Publish to gh-pages
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
